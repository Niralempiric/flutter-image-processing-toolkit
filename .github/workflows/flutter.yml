name: Flutter checks

on:
  push:
    branches: [main]
  # Every pull request, not only those aimed at main, so stacked PRs are checked.
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Pinned so the Android toolchain in example/android stays in step with
          # the SDK that builds it. Bump together with the Gradle/AGP/KGP versions.
          flutter-version: 3.50.0
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test example/lib example/test example/integration_test
      - run: flutter analyze
      - run: flutter test
      - run: flutter pub get
        working-directory: example
      - run: flutter test
        working-directory: example
      - run: flutter build apk --debug
        working-directory: example
